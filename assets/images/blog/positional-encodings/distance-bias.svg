<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><rect width="900" height="300" rx="20" fill="#f5f7fc"/><g font-family="Arial, sans-serif" fill="#20314d"><text x="30" y="40" font-size="18" fill="#52627b">SAME CONTENT MATCH? DISTANCE TIPS THE BALANCE.</text><rect x="30" y="70" width="175" height="50" rx="12" fill="white" stroke="#20314d"/><text x="48" y="100" font-size="20" fill="#20314d">Key at 4</text><text x="230" y="101" font-size="18" fill="#20314d">1 step</text><rect x="350" y="80" width="65" height="30" rx="6" fill="#f2c777"/><text x="430" y="102" font-size="20" fill="#985500">−0.5</text><rect x="30" y="140" width="175" height="50" rx="12" fill="white" stroke="#20314d"/><text x="48" y="170" font-size="20" fill="#20314d">Key at 2</text><text x="230" y="171" font-size="18" fill="#20314d">3 steps</text><rect x="350" y="150" width="195" height="30" rx="6" fill="#f2c777"/><text x="560" y="172" font-size="20" fill="#985500">−1.5</text><rect x="30" y="210" width="175" height="50" rx="12" fill="white" stroke="#20314d"/><text x="48" y="240" font-size="20" fill="#20314d">Key at 0</text><text x="230" y="241" font-size="18" fill="#20314d">5 steps</text><rect x="350" y="220" width="325" height="30" rx="6" fill="#f2c777"/><text x="690" y="242" font-size="20" fill="#985500">−2.5</text><text x="30" y="292" font-size="17" fill="#52627b">Query at 5 · slope = 0.5 · longer bar = larger score penalty</text></g></svg>