<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760"><rect width="900" height="760" rx="20" fill="#f5f7fc"/><g font-family="Arial, sans-serif" fill="#20314d"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><text x="35" y="40" font-size="18" fill="#52627b">ONE HEAD · FOLLOW THE MATCH, THEN THE MESSAGE</text><rect x="220" y="65" width="460" height="70" rx="12" fill="white" stroke="#20314d"/><text x="238" y="95" font-size="20" fill="#20314d">dog     ·     bites     ·     man</text><text x="238" y="120" font-size="16" fill="#52627b">Embedding lookup → 3 tokens × 5 dimensions</text><path d="M450 135 L450 155" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="160" width="460" height="60" rx="12" fill="#eaf1ff" stroke="#2459b4"/><text x="238" y="190" font-size="20" fill="#2459b4">A · Add an absolute position vector</text><path d="M450 220 L450 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="245" width="460" height="65" rx="12" fill="white" stroke="#20314d"/><text x="238" y="275" font-size="20" fill="#20314d">Project x into q, k, and v</text><text x="238" y="300" font-size="16" fill="#52627b">Each projection: 3 tokens × 3 dimensions</text><path d="M365 310 L365 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="335" width="475" height="60" rx="12" fill="#f2ebff" stroke="#7541b2"/><text x="118" y="365" font-size="20" fill="#7541b2">C · Rotate q and k by position</text><path d="M365 395 L365 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="420" width="475" height="60" rx="12" fill="white" stroke="#20314d"/><text x="118" y="450" font-size="20" fill="#20314d">Content score: q · k / √3</text><path d="M365 480 L365 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="505" width="475" height="60" rx="12" fill="#fff3db" stroke="#985500"/><text x="118" y="535" font-size="20" fill="#985500">B · Add a relative-position score term</text><path d="M365 565 L365 585" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="590" width="475" height="60" rx="12" fill="white" stroke="#20314d"/><text x="118" y="620" font-size="20" fill="#20314d">Softmax → attention weights</text><path d="M650 310 V620 H605" fill="none" stroke="#2459b4" stroke-width="3" marker-end="url(#arrow)"/><text x="672" y="410" font-size="26" fill="#2459b4">v</text><text x="672" y="440" font-size="16" fill="#20314d">Message</text><text x="672" y="462" font-size="16" fill="#20314d">bypasses</text><text x="672" y="484" font-size="16" fill="#20314d">the score</text><path d="M365 650 L365 665" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="670" width="680" height="65" rx="12" fill="white" stroke="#20314d"/><text x="118" y="700" font-size="20" fill="#20314d">Weighted sum of values → head output</text><text x="118" y="725" font-size="16" fill="#52627b">Then combine heads → output projection → residual + FFN</text></g></svg>